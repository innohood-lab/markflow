appId: com.innohood.markflow
productName: MarkFlow
copyright: Copyright © 2026 Kyujin Park (innohood)

directories:
  output: ../../dist
  buildResources: build

npmRebuild: false

asarUnpack:
  - '**/*.node'

files:
  - out/**/*
  - '!out/**/*.map'
  - package.json

extraResources:
  - from: ../../engine/dist/engine
    to: engine
    filter:
      - '**/*'

win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-Windows-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MarkFlow
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-Windows-Portable-${version}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.productivity
  artifactName: ${productName}-macOS-${version}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

fileAssociations:
  - ext: docx
    name: Microsoft Word Document
    role: Viewer
  - ext: pptx
    name: Microsoft PowerPoint Presentation
    role: Viewer
  - ext: xlsx
    name: Microsoft Excel Spreadsheet
    role: Viewer
  - ext: pdf
    name: Portable Document Format
    role: Viewer
  - ext: md
    name: Markdown Document
    role: Editor
