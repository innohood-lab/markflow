[project]
name = "markflow-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kyujin Park", email = "innohood@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "markitdown[all]>=0.1.8",
    "markitdown-ocr>=0.1.1",
    "pillow>=10.0.0",
    "pypdf>=6.21.1",
    "pytest>=8.0.0",
    "readability-lxml>=0.9",
    "uvicorn[standard]>=0.30.0",
    "xlrd>=2.0.1",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
